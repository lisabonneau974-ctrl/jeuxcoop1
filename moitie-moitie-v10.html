<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Moitié-Moitié</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout : scène 3D plein cadre ; mission en haut à gauche, état en haut à droite, jauge de coordination en bas au centre, manettes tactiles dans les coins. */
:root{
  --ink:#0d1222;
  --glass:rgba(15,21,40,.74);
  --line:rgba(170,190,255,.18);
  --paper:#eef1ff;
  --muted:#9aa6c8;
  --g:#ff6b4a;
  --d:#2ec5d3;
  --sun:#ffd447;
  --bad:#ff4f6d;
  --good:#5be3a0;
  --f-display:'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --f-body:'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:15px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 60%,rgba(5,8,18,.35) 100%)}

.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;gap:10px;justify-content:space-between;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
#mission{padding:10px 14px 12px;max-width:min(520px,100%);min-width:0}
#mission .kicker{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--sun)}
#mission h2{margin:0 0 3px;font-family:var(--f-display);font-weight:800;font-size:clamp(19px,2.8vw,26px);line-height:1.1;text-wrap:balance}
#mission p{margin:0;line-height:1.45;font-size:13.5px}
#status{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chip{padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted)}
.chip.on i{background:var(--good);box-shadow:0 0 10px var(--good)}
.chip.off i{background:var(--bad)}
.chip.mix i{background:linear-gradient(90deg,var(--g) 50%,var(--d) 50%)}
.dot{display:inline-block;padding:0 9px;border-radius:999px;font-weight:800;font-size:12px;color:#0d1222;margin:0 1px}
.dot.r{background:#ff6f86}.dot.v{background:#5be3a0}.dot.b{background:#6aa8ff}
.who-g{color:var(--g);font-weight:800}.who-d{color:var(--d);font-weight:800}

#coord{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:14px;padding:10px 16px;pointer-events:none}
.bar{width:14px;height:62px;border-radius:8px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.bar::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.35)}
.bar i{position:absolute;left:0;right:0;border-radius:8px;background:var(--c);box-shadow:0 0 12px var(--c)}
.bar.g{--c:var(--g)}.bar.d{--c:var(--d)}
#coord .mid{display:grid;justify-items:center;gap:1px;min-width:118px;text-align:center}
#coord .mid b{font-family:var(--f-display);font-size:18px;line-height:1.1}
#coord .mid small{font-size:11.5px;color:var(--muted)}
#coord .lab{font-size:11px;font-weight:800;display:grid;justify-items:center;gap:4px}

#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.96);padding:11px 18px;font-weight:700;font-size:15.5px;text-align:center;max-width:min(460px,calc(100vw - 32px));opacity:0;transition:opacity .2s, transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

#keys{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:space-between;gap:10px;pointer-events:none;font-size:12px;color:var(--muted)}
#keys span{padding:6px 11px;max-width:32%;line-height:1.7}
kbd{font-family:var(--f-body);font-weight:800;color:var(--paper);background:rgba(255,255,255,.08);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11.5px}

#touch{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.pad{display:flex;align-items:flex-end;gap:10px;pointer-events:auto}
.pad.right{flex-direction:row-reverse}
.stick{width:clamp(96px,24vw,126px);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(15,21,40,.6));border:2px solid var(--c);position:relative;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:var(--c);box-shadow:0 0 16px var(--c)}
.btns{display:flex;flex-direction:column;gap:8px}
.btns button{width:clamp(54px,13vw,66px);aspect-ratio:1;border-radius:50%;border:2px solid var(--c);background:rgba(15,21,40,.65);color:var(--paper);font:800 11px/1.1 var(--f-body);touch-action:none;padding:0}
.btns button.big{background:var(--c);color:#0d1222}
.btns button.held{transform:scale(.92);filter:brightness(1.25)}
.pad.left{--c:var(--g)}.pad.right{--c:var(--d)}

#card{position:fixed;inset:0;display:flex;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(90deg,rgba(255,107,74,.10),transparent 35%,transparent 65%,rgba(46,197,211,.10)),rgba(8,11,22,.55);z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#card .box{width:min(600px,100%);margin:auto;padding:24px 24px 22px;display:grid;gap:13px;border:1.5px solid transparent;background:linear-gradient(rgba(14,19,37,.88),rgba(14,19,37,.88)) padding-box,linear-gradient(120deg,var(--g),rgba(255,255,255,.1) 45%,rgba(255,255,255,.1) 55%,var(--d)) border-box;border-radius:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
#card .kicker{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--sun)}
#card h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(32px,7vw,56px);line-height:.95;text-wrap:balance}
#card h1 .a{color:var(--g)}#card h1 .b{color:var(--d)}
#card h1 .cut{display:inline-block;width:.12em;height:.8em;margin:0 .08em;background:var(--sun);transform:skewX(-14deg);border-radius:2px;box-shadow:0 0 14px var(--sun);vertical-align:-.04em}
#card p{margin:0;line-height:1.55;max-width:62ch}
#card .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#card .go{font:800 17px var(--f-body);padding:13px 24px;border-radius:999px;border:0;background:linear-gradient(90deg,var(--g) 0 50%,var(--d) 50% 100%);color:#0d1222;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 24px rgba(255,212,71,.15)}
#card .go:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
#card .alt{font:700 15px var(--f-body);padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--paper);cursor:pointer}
#card .alt.g{border-color:var(--g);color:var(--g)}#card .alt.d{border-color:var(--d);color:var(--d)}
#card button:disabled{opacity:.6;cursor:default}
#card button:focus-visible,#card input:focus-visible,#card summary:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#card input{font:800 22px var(--f-display);letter-spacing:.24em;text-transform:uppercase;width:7em;max-width:100%;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--paper)}
#card .code{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,13vw,72px);letter-spacing:.2em;color:var(--sun);line-height:1;text-shadow:0 0 30px rgba(255,212,71,.35)}
#card .err{color:var(--bad);font-weight:700}
#card .hint{font-size:13px;color:var(--muted)}
#card .lvsel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#card .lvsel span{font-size:13px;color:var(--muted);font-weight:700;margin-right:4px}
#card .lv{padding:6px 0;width:38px;font-size:14px}
#card details summary{cursor:pointer;color:var(--muted);font-weight:700}
#card details[open] summary{margin-bottom:10px}
#card .ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
#card .ctrl > div{padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);min-width:0}
#card .ctrl h3{margin:0 0 6px;font-size:14.5px}
#card .ctrl ul{margin:0;padding-left:18px;line-height:1.65;font-size:13px}
#card .how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#card .how div{padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12.5px;line-height:1.4;min-width:0}
#card .how b{display:block;font-family:var(--f-display);font-size:15px;margin-bottom:2px}
#rotate{font-size:13px;color:var(--sun)}
@media (max-width:560px){#card .how{grid-template-columns:1fr}#mission p{font-size:12.5px}#keys{display:none}}
@media (max-width:640px) and (orientation:portrait){#coord{bottom:calc(env(safe-area-inset-bottom,0px) + 168px)}}
.prompt{position:fixed;left:0;top:0;padding:5px 11px;border-radius:999px;font-weight:800;font-size:12.5px;white-space:nowrap;pointer-events:none;background:rgba(12,17,34,.86);border:1.5px solid var(--c);color:var(--paper);box-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent);will-change:transform}
.prompt kbd{border-color:var(--c);margin-right:4px}
#pr-g{--c:var(--g)}#pr-d{--c:var(--d)}
@media (max-height:480px){#mission{max-width:48vw;padding:7px 11px}#mission h2{font-size:17px}#mission p{font-size:11.5px;line-height:1.35}#coord{padding:6px 12px;gap:10px}.bar{height:44px}#coord .mid{min-width:96px}#coord .mid b{font-size:15px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="game"></div>
<div id="vignette"></div>

<div id="hud">
  <div id="mission" class="glass"><div class="kicker" id="m-kicker">Étage 1 sur 3</div><h2 id="m-title">La machine à café</h2><p id="m-text"></p></div>
  <div id="status"></div>
</div>

<div id="coord" class="glass" hidden>
  <div class="lab"><span class="who-g">G</span><div class="bar g"><i id="bar-g"></i></div></div>
  <div class="mid"><b id="coord-txt">À l'arrêt</b><small id="coord-sub">Avancez ensemble</small></div>
  <div class="lab"><span class="who-d">D</span><div class="bar d"><i id="bar-d"></i></div></div>
</div>

<div id="toast" class="glass"></div>
<div class="prompt" id="pr-g" hidden></div>
<div class="prompt" id="pr-d" hidden></div>

<div id="keys">
  <span class="glass"><b class="who-g">Gauche</b> <kbd>Z</kbd><kbd>S</kbd> sa roue · séparés <kbd>ZQSD</kbd> · <kbd>E</kbd> action · <kbd>R</kbd> clip</span>
  <span class="glass"><b class="who-d">Droite</b> <kbd>↑</kbd><kbd>↓</kbd> sa roue · séparés <kbd>←↑↓→</kbd> · <kbd>Entrée</kbd> action · <kbd>Maj droite</kbd> clip</span>
</div>

<div id="touch" hidden>
  <div class="pad left" data-p="g">
    <div class="stick"><div class="knob"></div></div>
    <div class="btns"><button class="big" data-b="action" aria-label="Gauche : action">Action</button><button data-b="clip" aria-label="Gauche : clip">Clip</button></div>
  </div>
  <div class="pad right" data-p="d">
    <div class="stick"><div class="knob"></div></div>
    <div class="btns"><button class="big" data-b="action" aria-label="Droite : action">Action</button><button data-b="clip" aria-label="Droite : clip">Clip</button></div>
  </div>
</div>

<div id="card"><div class="box" id="card-box"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
if (!window.THREE){ $('#card-box').innerHTML = '<div class="kicker">Oups</div><h1>Chargement impossible</h1><p>Le moteur 3D du jeu n\'a pas pu se charger. Vérifie que tu es connecté à internet, puis recharge la page.</p>'; return; }
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const r2 = v => Math.round(v*100)/100;
const lerpAngle = (a, b, k) => { let d = b - a; d = Math.atan2(Math.sin(d), Math.cos(d)); return a + d*k; };
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- Rendu ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('#game').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const BG = new THREE.Color('#0d1222').convertSRGBToLinear();
scene.background = BG;
scene.fog = new THREE.Fog(BG, 26, 70);
const camera = new THREE.PerspectiveCamera(46, 1, 0.6, 90);
const hemi = new THREE.HemisphereLight(new THREE.Color('#c9dcff').convertSRGBToLinear(), new THREE.Color('#2a2440').convertSRGBToLinear(), 0.7); scene.add(hemi);
const sun = new THREE.DirectionalLight(new THREE.Color('#fff4e6').convertSRGBToLinear(), 1.25);
sun.position.set(-6, 18, 9); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0008;
Object.assign(sun.shadow.camera, {left:-15, right:15, top:12, bottom:-12, near:1, far:50});
scene.add(sun, sun.target);
const warm = new THREE.PointLight(new THREE.Color('#ff8a5c').convertSRGBToLinear(), 0.9, 18, 2); warm.position.set(-8, 3, 2); scene.add(warm);
const cool = new THREE.PointLight(new THREE.Color('#48e0ee').convertSRGBToLinear(), 0.9, 18, 2); cool.position.set(8, 3, -2); scene.add(cool);

function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix(); if (typeof composer !== 'undefined' && composer) composer.setSize(w, h); }
addEventListener('resize', resize); resize();

const col = c => new THREE.Color(c).convertSRGBToLinear();
function mat(color, o={}){
  const m = new THREE.MeshStandardMaterial({color:col(color), roughness:o.rough ?? .6, metalness:o.metal ?? .05, emissive:col(o.emissive ?? 0x000000), emissiveIntensity:o.ei ?? 1, side:o.side ?? THREE.FrontSide});
  if (o.opacity != null){ m.transparent = true; m.opacity = o.opacity; }
  return m;
}
function box(w,h,d,color,o={}){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), o.material || mat(color,o)); m.castShadow = o.cast !== false; m.receiveShadow = true; return m; }
function cyl(rt,rb,h,color,o={}){ const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,o.seg||24), mat(color,o)); m.castShadow = o.cast !== false; m.receiveShadow = true; return m; }
function sph(r,color,o={}){ const m = new THREE.Mesh(new THREE.SphereGeometry(r,24,16), mat(color,o)); m.castShadow = o.cast !== false; return m; }
function canvasTex(w, h, draw){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }

function label(text, fg='#0d1222', bg='#ffd447', w=2.4, h=0.6){
  const tex = canvasTex(512, Math.round(512*h/w), (g, W, H) => {
    g.fillStyle = bg; g.beginPath(); g.roundRect ? g.roundRect(0,0,W,H,H*0.25) : g.rect(0,0,W,H); g.fill();
    g.fillStyle = fg; g.font = `800 ${Math.round(H*.62)}px "Baloo 2", "Trebuchet MS", sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, W/2, H/2+3);
  });
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:tex, transparent:true, toneMapped:false}));
}
const glowTex = canvasTex(128, 128, (g) => { const r = g.createRadialGradient(64,64,0,64,64,64); r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.35,'rgba(255,255,255,.45)'); r.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0,0,128,128); });
function glowDisc(color, size){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size,size), new THREE.MeshBasicMaterial({map:glowTex, color:col(color), transparent:true, opacity:.75, depthWrite:false, blending:THREE.AdditiveBlending, toneMapped:false}));
  m.rotation.x = -Math.PI/2; m.position.y = 0.03; return m;
}

/* Sol du labo : dalles polies aux coins arrondis, joints clairs */
(function floor(){
  const tex = canvasTex(512, 512, (g) => {
    g.fillStyle = '#2a3046'; g.fillRect(0,0,512,512);
    const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); };
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++){
      const x = i*256 + 6, y = j*256 + 6;
      const gr = g.createLinearGradient(x, y, x+244, y+244); gr.addColorStop(0, (i+j)%2 ? '#4a5372' : '#465070'); gr.addColorStop(1, (i+j)%2 ? '#424b68' : '#3f4865');
      g.fillStyle = gr; rr(x, y, 244, 244, 26); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 3; rr(x+3, y+3, 238, 238, 24); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.18)'; for (const [a, b] of [[22,22],[222,22],[22,222],[222,222]]){ g.beginPath(); g.arc(x+a, y+b, 4, 0, 7); g.fill(); }
    }
    for (let k = 0; k < 900; k++){ g.fillStyle = `rgba(255,255,255,${Math.random()*0.025})`; g.fillRect(Math.random()*512, Math.random()*512, 2, 2); }
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(8.25, 6); tex.anisotropy = 8;
  const f = new THREE.Mesh(new THREE.PlaneGeometry(22,16), new THREE.MeshPhysicalMaterial({map:tex, roughness:.38, metalness:.15, clearcoat:.6, clearcoatRoughness:.25}));
  f.rotation.x = -Math.PI/2; f.receiveShadow = true; f.userData.envTuned = true; f.material.envMapIntensity = 0.55; scene.add(f);
  const under = new THREE.Mesh(new THREE.PlaneGeometry(140,140), mat('#0a0e1b')); under.rotation.x = -Math.PI/2; under.position.y = -0.4; scene.add(under);
  for (const z of [-7.6, 7.6]){ const s = box(21.6, 0.02, 0.08, '#2ec5d3', {emissive:'#2ec5d3', ei:1.6, cast:false}); s.position.set(0, 0.012, z); scene.add(s); }
})();

/* Poussière lumineuse qui flotte dans le labo */
const dust = (() => {
  const n = 160, pos = new Float32Array(n*3);
  for (let i = 0; i < n; i++){ pos[i*3] = (Math.random()*2-1)*11; pos[i*3+1] = Math.random()*4; pos[i*3+2] = (Math.random()*2-1)*8; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({color:col('#a9f1ff'), size:0.06, transparent:true, opacity:.55, depthWrite:false, blending:THREE.AdditiveBlending}));
  scene.add(p); return p;
})();

/* Étincelles, confettis et poussière : un seul système de particules */
const FX = (() => {
  const N = 500, pos = new Float32Array(N*3), cols = new Float32Array(N*3);
  const vel = new Float32Array(N*3), life = new Float32Array(N), maxL = new Float32Array(N), grav = new Float32Array(N), base = new Float32Array(N*3);
  for (let i = 0; i < N; i++) pos[i*3+1] = -50;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(cols, 3));

function pushOut(e, r){
  for (let pass = 0; pass < 2; pass++){
    for (const w of W.walls){
      if (w.off) continue;
      const cx = clamp(e.x, w.x1, w.x2), cz = clamp(e.z, w.z1, w.z2);
      const dx = e.x-cx, dz = e.z-cz, d2 = dx*dx+dz*dz;
      if (d2 >= r*r) continue;
      if (d2 > 1e-8){ const d = Math.sqrt(d2); e.x = cx + dx/d*r; e.z = cz + dz/d*r; }

  let idx = 0, powered = false, done = false, brew = 0, splash = 0, steamT = 0, needle = 0, errFlash = 0;

  const showPower = () => { pedal.glow(powered); led.material.emissive.copy(col(powered ? '#2ec5d3' : '#3a1018')); led.material.emissiveIntensity = powered ? 2.5 : 0.4; };
  const startBrew = () => { brew = 2.6; };

    update(dt){ powered = someoneOn(pedal); showPower(); anim(dt); },
    goal(){ if (delivered) return null; if (done) return brew > 0 ? {x:8.6, z:-1} : (cup.holder ? desk : cup); return powered ? {x:9, z:-1} : pedal; },
    targets(){ return done ? [] : buttons.map(b => ({x:b.x, z:b.z, label:`Appuyer sur le bouton ${b.n}`, act:() => this.press(b)})); },
    press(best){
      best.push = 0.25;

      if (best.i === seq[idx]){
        idx++; light(); blip(520+idx*160,.1,'triangle');
        if (idx === 3){ done = true; startBrew(); toast('Glouglou… la machine prépare le café !', 2400); blip(300, .5, 'sawtooth', .03); }
        else toast(`Bouton ${best.n} : bien joué (${idx}/3)`, 1100);
      } else { idx = 0; light(); doSplash(); toast('Mauvais ordre. La machine crache du café froid. On recommence.'); blip(160,.3,'sawtooth'); }
    },
    status(){ return chip(powered ? 'Courant : oui' : 'Courant : non', powered ? 'on' : 'off') + chip(delivered ? 'Café : livré' : `Café : ${idx}/3`, idx === 3 ? 'on' : ''); },
    getVis(){ return [idx, powered ? 1 : 0, delivered ? 1 : 0]; },
    setVis(v, dt){

      if (v[2] && !delivered){ delivered = true; mon.userData.setText('CAFÉ : 100 %\nSAVANT : RAVI\nSORTIE : OUVERTE', '#ffd447', '#2a2108'); }
      anim(dt || 0.016);
    }
  };
}

/* Étage 2 : le chat du labo */
function buildL2(){
  room(); door = exitDoor('SORTIE');
  crate(-6,-3); crate(-5,-3.2,0.8); crate(4,-2); crate(7,3); crate(-2,2,0.9);
  bench(-9,-6.5,-6,-5.5); bench(5.5,-6.5,8.5,-5.5);
  flaskShelf(-2.5,-7.4,0); addWall(-3.7,-7.7,-1.3,-7.1,{invisible:true});
  const cat = {x:5, z:-4, side:1, sideT:0, tx:5, tz:-4, caught:false};
  const g = new THREE.Group();
  const fur = mat('#2b2b38', {rough:.9});
  const bodyM = new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 14), fur); bodyM.scale.set(0.85, 0.75, 1.25); bodyM.position.y = 0.3; bodyM.castShadow = true; g.add(bodyM);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 20, 14), fur); head.position.set(0, 0.52, 0.38); head.castShadow = true; g.add(head);
  for (const s of [-1,1]){
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.08,0.17,4), fur); ear.position.set(0.11*s,0.72,0.36); g.add(ear);
    const eye = sph(0.045,'#d6ff4a',{emissive:'#d6ff4a',ei:2,cast:false}); eye.position.set(0.08*s,0.55,0.56); g.add(eye);
  }
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.05,0.55,8), fur); tail.position.set(0,0.45,-0.42); tail.rotation.x = -0.8; g.add(tail);
  const card = box(0.3,0.02,0.2,'#6aa8ff',{emissive:'#6aa8ff',ei:1.2,cast:false}); card.position.set(0,0.42,0.6); g.add(card);
  const q = label('?','#0d1222','#ffd447',0.36,0.36); q.position.set(0,1.05,0); q.visible = false; g.add(q);
  levelGroup.add(g);
  makeItem('wool', 'la pelote de laine', -7.5, 4.5); makeItem('bolt', 'le boulon', 7.5, 6);
  const cardItem = makeItem('card', 'la carte d\'accès', 0, 0, false);
  const reader = box(0.5,0.7,0.12,'#1b2134',{metal:.4}); reader.position.set(2.6,1.1,-7.9); levelGroup.add(reader);
  const readerLed = box(0.3,0.12,0.03,'#ff4f6d',{emissive:'#ff4f6d',ei:2,cast:false}); readerLed.position.set(2.6,1.3,-7.83); levelGroup.add(readerLed);
  const rl = label('LECTEUR','#0d1222','#ffd447',0.9,0.24); rl.position.set(2.6,1.62,-7.95); levelGroup.add(rl);
  let carded = false;
  const slot = makeSocket('card', 'le lecteur', 2.6, -7.1, () => { carded = true; readerLed.material.emissive.copy(col('#5be3a0')); openDoor(); toast('Bip ! Carte acceptée. La porte s\'ouvre.', 3000); });
  slot.y = 0.0;
  let lt = 0, confused = false, said = false;
  const catchIt = (half) => { cat.caught = true; levelGroup.remove(g); cardItem.active = true; cardItem.mesh.visible = true; cardItem.x = half.x; cardItem.z = half.z; pick(half, cardItem); fx('win', cat.x, cat.z, '#6aa8ff'); blip(880,.15,'triangle'); toast('Attrapé ! Le chat lâche la carte d\'accès. Glissez-la dans le lecteur près de la porte.', 3400); };
  return {
    mission: `Le chat a volé la carte d'accès. Il fuit tout ce qui bouge… mais s'il est pris entre vos deux moitiés, il ne sait plus où aller. Séparez-vous, coincez-le à deux, et attrapez-le (<b>Action</b>).`,
    update(dt){
      lt += dt;
      if (cat.caught) return;
      const srcs = assembled ? [robot] : [G, D];
      let rx = 0, rz = 0, near = 99;
      for (const p of srcs){ const dx = cat.x-p.x, dz = cat.z-p.z, d = Math.hypot(dx,dz) || 0.01; near = Math.min(near, d); if (d < 5.5){ const w = 1/(d*d+0.15); rx += dx/d*w; rz += dz/d*w; } }
      const mag = Math.hypot(rx, rz);
      cat.sideT -= dt; if (cat.sideT <= 0){ cat.side = Math.random() < .5 ? -1 : 1; cat.sideT = 0.8 + Math.random()*1.2; }
      let vx, vz, sp;
      confused = !assembled && near < 2.6 && mag < 0.32;
      if (near < 5.5){
        const ax = rx/(mag||1), az = rz/(mag||1);
        vx = ax + (near < 2 ? -az*cat.side*0.7 : 0); vz = az + (near < 2 ? ax*cat.side*0.7 : 0);
        sp = confused ? 0.6 : clamp(mag*8.5, 2, 8.2);
      } else {
        if (Math.hypot(cat.tx-cat.x, cat.tz-cat.z) < 0.4){ cat.tx = (Math.random()*2-1)*9; cat.tz = (Math.random()*2-1)*6; }
        const tx = cat.tx-cat.x, tz = cat.tz-cat.z, d = Math.hypot(tx,tz) || 1; vx = tx/d; vz = tz/d; sp = 1.3;
      }
      const l = Math.hypot(vx,vz) || 1; cat.x += vx/l*sp*dt; cat.z += vz/l*sp*dt;
      pushOut(cat, 0.38);
      if (confused && !said){ said = true; toast('Le chat est coincé entre vous deux ! Attrapez-le !', 1800); }
      if (!confused) said = false;
      q.visible = confused;
      g.position.set(cat.x, Math.abs(Math.sin(lt*sp*2))*0.04*Math.min(sp,4), cat.z);
      g.rotation.y = lerpAngle(g.rotation.y, Math.atan2(vx, vz), 0.25);
      tail.rotation.z = Math.sin(lt*6)*0.5;
    },
    targets(h){ return cat.caught ? [] : [{x:cat.x, z:cat.z, label:'Attraper le chat', act:() => catchIt(h)}]; },
    goal(){ if (carded) return null; if (!cat.caught) return cat; return cardItem.holder ? slot : cardItem; },
    status(){ return chip(carded ? 'Porte : ouverte' : cat.caught ? 'Carte : récupérée' : 'Chat : en fuite', cat.caught ? 'on' : 'off'); },
    getVis(){ return [r2(cat.x), r2(cat.z), r2(g.rotation.y), cat.caught ? 1 : 0, confused ? 1 : 0, carded ? 1 : 0]; },
    setVis(v, dt){
      if (!Array.isArray(v)) return;
      lt += dt;
      if (v[3] && !cat.caught){ cat.caught = true; levelGroup.remove(g); }
      if (v[5] && !carded){ carded = true; readerLed.material.emissive.copy(col('#5be3a0')); }
      if (cat.caught) return;
      const k = Math.min(1, dt*14);
      cat.x = lerp(cat.x, +v[0] || 0, k); cat.z = lerp(cat.z, +v[1] || 0, k);
      g.position.set(cat.x, 0, cat.z); g.rotation.y = +v[2] || 0; q.visible = !!v[4]; tail.rotation.z = Math.sin(lt*6)*0.5;
    }
  };
}

function buildChem(rng){
  room(); door = exitDoor('SORTIE');
  const COL = [{n:'rouge', c:'#ff4f6d'}, {n:'bleue', c:'#4f8bff'}, {n:'verte', c:'#5be3a0'}, {n:'jaune', c:'#ffd447'}];
  const MIX = {'bleue+rouge':'#b061ff', 'rouge+verte':'#b08a3a', 'jaune+rouge':'#ff9a3a', 'bleue+verte':'#2ec5b0', 'bleue+jaune':'#7ddf5a', 'jaune+verte':'#c8f04a'};
  const order = [0,1,2,3]; for (let i = 3; i > 0; i--){ const j = Math.floor(rng()*(i+1)); [order[i],order[j]] = [order[j],order[i]]; }
  const recipe = [order[0], order[1]].map(i => COL[i].n).sort();
  bench(-4, -1, -1, 0); bench(2, 2.5, 5, 3.3); crate(-7, 1.5, 0.9);
  flaskShelf(-2, -7.4, 0); addWall(-3.2, -7.7, -0.8, -7.1, {invisible:true});
  // écran de la recette, allumé seulement si quelqu'un est sur la plaque
  const mon = monitor(-8.5, -7.3, 0, 'RECETTE :\nMONTEZ SUR\nLA PLAQUE');
  addWall(-9.3, -7.7, -7.7, -6.9, {invisible:true});
  const readPlate = plate(-8.5, -5.4, 1.8, 1.4, '#6aa8ff', 'LIRE');
  // chaudron
  addWall(5.2, -6.2, 8.0, -4.6, {invisible:true});
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 0.9, 1.0, 36), DM.white); pot.position.set(6.6, 0.5, -5.4); pot.castShadow = true; levelGroup.add(pot);
  const potBand = new THREE.Mesh(new THREE.CylinderGeometry(1.03, 1.0, 0.18, 36), DM.orange); potBand.position.set(6.6, 0.45, -5.4); levelGroup.add(potBand);
  for (let i = 0; i < 3; i++){ const a = i/3*Math.PI*2; const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.3, 10), DM.chrome); leg.position.set(6.6 + Math.cos(a)*0.75, 0.05, -5.4 + Math.sin(a)*0.75); levelGroup.add(leg); }
  const brew = cyl(1.0, 1.0, 0.05, '#2a3150', {emissive:'#2a3150', ei:.4, cast:false, seg:28}); brew.position.set(6.6, 0.98, -5.4); levelGroup.add(brew);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.07, 10, 36), mat('#e9edf6', {metal:1, rough:.15})); rim.rotation.x = Math.PI/2; rim.position.set(6.6, 1.0, -5.4); levelGroup.add(rim);
  const potSign = label('MÉLANGEUR', '#0d1222', '#ffd447', 1.8, 0.36); potSign.position.set(6.6, 1.6, -4.25); levelGroup.add(potSign);
  const homes = [[-9.2, 5.5], [9.2, 5.5], [-9.2, -2.5], [9.4, -1.5]];
  const flasks = COL.map((c, i) => makeItem('flask', `la fiole ${c.n}`, homes[i][0], homes[i][1], true, c.c));
  flasks.forEach((f, i) => f.cname = COL[i].n);
  let done = false, reading = false;
  const socks = [];
  const onFill = (it) => {
    if (!recipe.includes(it.cname)){
      const sk = socks.find(k => k.filled && Math.hypot(k.x-it.x, k.z-it.z) < 0.2);
      fx('zap', it.x, it.z, it.color); toast(`Pschhh ! La fiole ${it.cname} n'est pas dans la recette. Elle retourne à sa place.`, 2600);
      if (sk) unfill(sk, it); return;
    }
    if (socks.every(k => k.filled)){
      const names = flasks.filter(f => f.locked).map(f => f.cname).sort();
      if (names[0] === names[1]) return;
      done = true; brew.material.color.copy(col(MIX[names.join('+')] || '#ffffff')); brew.material.emissive.copy(col(MIX[names.join('+')] || '#ffffff')); brew.material.emissiveIntensity = 2.2;
      fx('win', 6.6, -5.4, MIX[names.join('+')] || '#ffd447'); openDoor(); toast('Bloup bloup ! Mélange parfait. La porte s\'ouvre.', 3200);
    } else toast('Une fiole de plus et le mélange est prêt.', 1600);
  };
  socks.push(makeSocket('flask', 'le mélangeur', 5.6, -3.9, onFill), makeSocket('flask', 'le mélangeur', 7.6, -3.9, onFill));
  const showScreen = () => mon.userData.setText(reading ? `RECETTE :\nFIOLE ${recipe[0].toUpperCase()}\n+ FIOLE ${recipe[1].toUpperCase()}` : 'RECETTE :\nMONTEZ SUR\nLA PLAQUE', reading ? '#ffd447' : '#5fffe0', reading ? '#2a2108' : '#082a33');
  let lastReading = null;
  return {
    mission: `Préparez la potion d'ouverture. La recette ne s'affiche sur l'écran que quand une moitié reste sur la plaque <b>LIRE</b>. L'autre va chercher les deux bonnes fioles et les pose dans le mélangeur.`,
    update(){ reading = someoneOn(readPlate); readPlate.glow(reading); if (reading !== lastReading){ lastReading = reading; showScreen(); } },
    goal(){ if (done) return null; if (!reading) return readPlate; const held = flasks.find(f => f.holder && recipe.includes(f.cname)); if (held) return socks.find(k => !k.filled); return flasks.find(f => recipe.includes(f.cname) && !f.locked && !f.holder); },
    status(){ return chip(done ? 'Potion : prête' : 'Potion : à faire', done ? 'on' : '') + chip(reading ? 'Écran : allumé' : 'Écran : éteint', reading ? 'on' : 'off'); },
    getVis(){ return [done ? 1 : 0]; },
    setVis(v){ reading = someoneOn(readPlate); readPlate.glow(reading); if (reading !== lastReading){ lastReading = reading; showScreen(); } if (Array.isArray(v) && v[0] && !done){ done = true; const names = flasks.filter(f => f.locked).map(f => f.cname).sort(); const c = MIX[names.join('+')] || '#ffd447'; brew.material.color.copy(col(c)); brew.material.emissive.copy(col(c)); brew.material.emissiveIntensity = 2.2; } }
  };
}

function buildRush(){

  addWall(-10.8, 6.0, -5.2, 7.6, {invisible:true});
  put(rbox(5.4, 1.6, 1.5, 0.16, DM.white), -8.0, 0.8, 6.8);
  put(rbox(5.5, 0.08, 1.6, 0.03, DM.chrome), -8.0, 1.62, 6.8);
  const sign = label('GÉNÉRATEUR TURBO', '#0d1222', '#5be3a0', 2.6, 0.38); sign.position.set(-8.0, 1.85, 6.04); levelGroup.add(sign);
  const tubes = [];
  for (let i = 0; i < 4; i++){ const x = -9.9 + i*1.25; const lq = cyl(0.16, 0.16, 1.0, '#5be3a0', {emissive:'#5be3a0', ei:.15, cast:false}); lq.position.set(x, 0.9, 6.0); lq.scale.y = 0.05; levelGroup.add(lq); tubes.push(lq); const gl = cyl(0.2, 0.2, 1.1, '#ffffff', {opacity:.25, rough:.05, cast:false}); gl.position.set(x, 0.9, 6.0); levelGroup.add(gl); }
  let count = 0, time = 120, warned = false;
  const show = () => tubes.forEach((tb, i) => { tb.scale.y = i < count ? 1 : 0.05; tb.material.emissiveIntensity = i < count ? 2.4 : 0.15; });
  const onFill = () => { count++; show(); if (count >= 4){ openDoor(); toast('Générateur chargé ! Vite, à la sortie !', 2600); } else toast(`Batterie ${count}/4`, 1200); };
  const socks = [0,1,2,3].map(i => makeSocket('battery', 'le générateur', -9.9 + i*1.25, 5.1, onFill));
  const bats = [[-8.5, -5.6], [-2, -6.4], [2.5, -5.8], [8.8, -5.2]].map(([x, z]) => makeItem('battery', 'la batterie', x, z));
  return {
    mission: `Course contre la montre : <b>2 minutes</b> pour rapporter les <b>4 batteries</b> au générateur, en traversant deux tapis roulants qui vont en sens inverse et un laser, puis atteindre la sortie. Si le temps est écoulé, l'étage recommence !`,
    update(dt){
      time -= dt;
      if (time < 20 && !warned){ warned = true; toast('Plus que 20 secondes !', 1800); }
      if (time <= 0) failMsg = 'Temps écoulé ! L\'étage recommence.';
    },
    goal(){ if (count >= 4) return null; const held = bats.find(b => b.holder); if (held) return socks.find(k => !k.filled); return bats.find(b => !b.locked && !b.holder); },
    status(){ const tt = Math.max(0, Math.ceil(time)); return chip(`Temps : ${Math.floor(tt/60)}:${String(tt%60).padStart(2,'0')}`, tt <= 20 ? 'off' : 'on') + chip(`Batteries : ${count}/4`, count >= 4 ? 'on' : ''); },
    getVis(){ return [count, Math.round(time)]; },
    setVis(v, dt){ if (!Array.isArray(v)) return; if ((v[0]|0) !== count){ count = v[0]|0; show(); } time = +v[1] || 0; }
  };
}

/* ---------- Logique de jeu ---------- */
const camT = {x:0, z:6, h:12};
let t = 0, playing = false, elapsed = 0, menuOrbit = false;
const vote = {g:-9, d:-9, pending:false};
function moveHalf(e, mx, mz, speed, dt){
  e.x += mx*speed*dt; e.z += mz*speed*dt; pushOut(e, 0.36);
  const m = Math.hypot(mx,mz);
  if (m > 0.1){ e.face = lerpAngle(e.face, Math.atan2(mx, mz), Math.min(1, dt*12)); e.walk += dt*speed*3*m; e.wheel += dt*speed*5*m; }
}
function toggleClip(){
  if (assembled){
    if (robot.y > 0.1) return;
    const rx = -Math.cos(robot.h), rz = Math.sin(robot.h);
    const gx = robot.x - rx*0.7, gz = robot.z - rz*0.7, dx = robot.x + rx*0.7, dz = robot.z + rz*0.7;
    G.x = blocked(gx,gz,0.36) ? robot.x - rx*0.25 : gx; G.z = blocked(gx,gz,0.36) ? robot.z - rz*0.25 : gz;
    D.x = blocked(dx,dz,0.36) ? robot.x + rx*0.25 : dx; D.z = blocked(dx,dz,0.36) ? robot.z + rz*0.25 : dz;
    pushOut(G, 0.36); pushOut(D, 0.36);
    G.face = D.face = robot.h; assembled = false;
    fx('clip', robot.x, robot.z); toast('Clac ! Séparés.', 1000); blip(300,.12,'square'); blip(220,.12,'square');
  } else {
    const d = Math.hypot(G.x-D.x, G.z-D.z);
    if (d < 1.35){
      const rx = (D.x-G.x)/(d||1), rz = (D.z-G.z)/(d||1);
      robot.x = (G.x+D.x)/2; robot.z = (G.z+D.z)/2; robot.h = d > 0.05 ? Math.atan2(rz, -rx) : G.face; robot.y = 0; robot.vy = 0;
      pushOut(robot, 0.62); assembled = true; placeHalves();
      fx('clip', robot.x, robot.z); toast('Clic ! Réassemblés. Coordonnez vos roues.', 1300); blip(440,.08,'triangle'); blip(660,.1,'triangle');
    } else toast('Trop loin pour se rassembler. Rapprochez-vous.', 1200);
  }
}
let dustT = 0;
function jumpPress(k){
  vote[k] = t;
  if (robot.y > 0.001) return;
  if (Math.abs(vote.g - vote.d) < 0.3){ robot.vy = 8.2; vote.g = vote.d = -9; vote.pending = false; blip(380,.08,'triangle'); blip(560,.1,'triangle'); fx('jump', robot.x, robot.z); }
  else { vote.pending = true; robot.wobble = 0.35; }
}
let failMsg = null;
function sendHome(h){ const it = h.item; if (!it) return; it.holder = null; h.item = null; it.x = it.hx; it.z = it.hz; if (it.mesh.userData.halo) it.mesh.userData.halo.visible = true; }
function caughtBy(msg, dr){
  if (caughtCool > 0) return; caughtCool = 1.2;
  fx('zap', assembled ? robot.x : G.x, assembled ? robot.z : G.z); toast(msg, 2200); blip(880, .1, 'square', .06); blip(440, .3, 'square', .06);
  sendHome(G); sendHome(D); resetRobot();
}
let caughtCool = 0;
function hitLaser(Lz, e, r){ return Math.abs(e.z - Lz.z) < r + 0.05 && e.x > Lz.x1 && e.x < Lz.x2; }
function zapMsg(){ toast('Zap ! Retour au départ.', 1400); blip(120,.35,'sawtooth',0.07); }

function update(dt){
  const inp = readInput();
  if (!playing){ if (cardGo && (inp.g.actionEdge || inp.d.actionEdge || inp.goEdge)) cardGo(); return; }
  t += dt; elapsed += dt;
  if (inp.g.clipEdge || inp.d.clipEdge) toggleClip();

  if (assembled){
    // chaque joueur pousse sa propre roue : il faut se coordonner pour aller tout droit
    const tl = clamp(-inp.g.mz, -1, 1), tr = clamp(-inp.d.mz, -1, 1);
    throttle.g = lerp(throttle.g, tl, Math.min(1, dt*10)); throttle.d = lerp(throttle.d, tr, Math.min(1, dt*10));
    const v = (throttle.g + throttle.d)/2 * 4.4, w = (throttle.d - throttle.g) * 2.3;
    robot.h += w*dt;
    robot.x += Math.sin(robot.h)*v*dt; robot.z += Math.cos(robot.h)*v*dt;
    pushOut(robot, 0.62);
    G.wheel += throttle.g*dt*9; D.wheel += throttle.d*dt*9;
    robot.lean = lerp(robot.lean, (throttle.g - throttle.d)*0.12, Math.min(1, dt*6));
    dustT -= dt; if (Math.abs(v) > 1.5 && dustT <= 0 && robot.y <= 0){ dustT = 0.07; fx('dust', G.x, G.z); fx('dust', D.x, D.z); }
    robot.vy -= 24*dt; robot.y += robot.vy*dt; if (robot.y < 0){ robot.y = 0; robot.vy = 0; }
    placeHalves();
  } else {
    throttle.g = throttle.d = 0; robot.lean = 0;
    moveHalf(G, inp.g.mx, inp.g.mz, 2.9, dt);
    moveHalf(D, inp.d.mx, inp.d.mz, 2.9, dt);
  }
  // Action : prendre / poser / appuyer s'il y a quelque chose à portée, sinon sauter (assemblés, ensemble)
  for (const [h, k] of [[G,'g'],[D,'d']]){
    if (!inp[k].actionEdge) continue;
    const tg = bestTarget(h);
    if (tg){ tg.act(h); h.grab = 0.3; }
    else if (assembled) jumpPress(k);
    else { h.grab = 0.2; blip(300,.04,'triangle',.03); }
  }
  if (vote.pending && t - Math.max(vote.g, vote.d) > 0.32){ vote.pending = false; toast('Pour sauter, appuyez sur Action en même temps !', 1500); }
  G.prompt = bestTarget(G)?.label || ''; D.prompt = bestTarget(D)?.label || '';
  robot.wobble = Math.max(0, robot.wobble - dt);
  caughtCool = Math.max(0, caughtCool - dt);
  L.update(dt);
  if (failMsg){ const m = failMsg; failMsg = null; loadLevel(levelIndex); toast(m, 3400); fx('zap', robot.x, robot.z); return; }
  for (const c of CRUSHERS){
    updateCrusher(c);
    if (!c.down) continue;
    if (assembled){ if (inZone(c, robot, 0.62)){ fx('zap', robot.x, robot.z); toast('Écrasé ! Retour au départ.', 1400); blip(120,.35,'sawtooth',0.07); resetRobot(); } }
    else for (const h of HALVES) if (inZone(c, h, 0.36)){ fx('zap', h.x, h.z); toast('Écrasé ! Retour au départ.', 1400); h.x = SPAWN.x + (h === G ? -0.7 : 0.7); h.z = SPAWN.z; }
  }

  // tapis roulants
  for (const c of CONVEYORS){
    if (assembled){ if (robot.y < 0.05 && c.has(robot)){ robot.x += c.vx*dt; pushOut(robot, 0.62); placeHalves(); } }
    else for (const h of HALVES) if (c.has(h)){ h.x += c.vx*dt; pushOut(h, 0.36); }
    for (const it of ITEMS) if (it.active && !it.holder && !it.locked && c.has(it)){ it.x += c.vx*dt; pushOut(it, 0.25); }
  }
  for (const Lz of W.lasers){
    updateLaser(Lz);
    if (!Lz.on) continue;
    if (assembled){ if (robot.y < 0.55 && hitLaser(Lz, robot, 0.6)){ fx('zap', robot.x, robot.z); zapMsg(); resetRobot(); } }
    else for (const h of HALVES){ if (hitLaser(Lz, h, 0.36)){ fx('zap', h.x, h.z); zapMsg(); h.x = SPAWN.x + (h === G ? -0.7 : 0.7); h.z = SPAWN.z; } }
  }

  if (door.open){
    const ok = assembled ? door.pad.has(robot) : (!L.needAssembled && door.pad.has(G) && door.pad.has(D));
    if (ok){ fx('win', door.pad.x, door.pad.z, '#5be3a0'); finishLevel(); return; }
  }
  setGauge(assembled, throttle.g, throttle.d);
  setStatus(statusLine());
}

function animHalf(h, dt){
  const ud = h.mesh.userData;
  h.grab = Math.max(0, h.grab - dt);
  if (assembled){
    h.mesh.position.set(h.x, robot.y, h.z);
    h.mesh.rotation.set(0, robot.h, 0);
    h.mesh.rotation.z = robot.lean + (robot.wobble ? Math.sin(t*40)*0.06 : 0);
    ud.inner.rotation.z = 0; ud.inner.position.y = 0;
    ud.cut.visible = false;
  } else {
    const hop = Math.abs(Math.sin(h.walk))*0.1;
    h.mesh.position.set(h.x, 0, h.z);
    h.mesh.rotation.set(0, h.face, 0);
    ud.inner.position.y = hop;
    ud.inner.rotation.z = -ud.sgn*0.1;   // une moitié seule penche un peu vers sa coupure
    ud.cut.visible = true;
  }
  ud.wheelG.rotation.x = h.wheel;
  const kA = Math.min(1, dt*10);
  ud.shoulder.rotation.x = lerp(ud.shoulder.rotation.x, h.item ? -0.95 : h.grab > 0 ? -1.5 : -0.25 + Math.sin(t*2 + ud.sgn)*0.1, kA);
  ud.elbow.rotation.x = lerp(ud.elbow.rotation.x, h.item ? -0.75 : h.grab > 0 ? -0.25 : -0.7, kA);
  ud.shoulder.rotation.z = ud.sgn*0.12;
  const open = h.item ? 0.02 : h.grab > 0 ? 0.55 : 0.18;
  ud.fingers[0].rotation.z = lerp(ud.fingers[0].rotation.z, -open, kA); ud.fingers[1].rotation.z = lerp(ud.fingers[1].rotation.z, open, kA);
  const blink = (t*0.7 + (h === G ? 0 : 0.37)) % 3.2 < 0.08 ? 0.15 : 1;
  ud.eye.scale.y = 1.3*blink; ud.pupil.scale.y = blink;
  ud.brow.rotation.z = ud.sgn*(robot.wobble > 0 ? -0.35 : 0.12);
  ud.earLed.material.emissiveIntensity = 2 + Math.sin(t*3 + ud.sgn*2)*1.5;
  ud.tip.material.emissiveIntensity = 1 + Math.sin(t*5 + ud.sgn)*0.6;
  h.glow.position.set(h.x, 0.03, h.z);
}
function animate(dt){

const prEl = {g:$('#pr-g'), d:$('#pr-d')};

    if (!text){ el.hidden = true; continue; }
    const v = new THREE.Vector3(h.x, assembled ? 2.35 : 1.95, h.z).project(camera);
    const x = (v.x + 1)/2*innerWidth, y = (1 - v.y)/2*innerHeight;
    const kh = keyHint(h.side);
    const html = (kh === null ? '' : kh) + text;
    if (el.dataset.t !== html){ el.innerHTML = html; el.dataset.t = html; }
    el.hidden = false;
    const ox = assembled ? (h === G ? 'calc(-100% - 6px)' : '6px') : '-50%';
    el.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px) translate(${ox}, -100%)`;
  }
}
function statusLine(){
  let net = '';
  if (NET.mode !== 'local'){
    const stale = performance.now() - NET.lastRx > 5000;
    net = chip(stale ? 'Ami déconnecté' : 'En ligne · ' + NET.code.toUpperCase(), stale ? 'off' : 'on');
  }
  const near = !assembled && Math.hypot(G.x-D.x, G.z-D.z) < 1.35;
  return net + chip(assembled ? 'Assemblés' : (near ? 'Proches : Clip pour s\'assembler' : 'Séparés'), 'mix') + (L ? L.status() : '');
}

/* ---------- Cartes ---------- */
let cardGo = null;
const cardEl = $('#card'), cardBox = $('#card-box');
function showCard(html, buttons, primary, after=''){
  playing = false;
  cardBox.innerHTML = html + `<div class="actions">${buttons.map((b,i) => `<button type="button" class="${b.cls || 'go'}" data-i="${i}">${b.label}</button>`).join('')}</div>` + after;
  cardEl.hidden = false; cardEl.scrollTop = 0;
  cardBox.querySelectorAll('.actions button').forEach(el => el.addEventListener('click', () => { ensureAudio(); buttons[+el.dataset.i].on(); }));
  cardGo = primary ? () => { ensureAudio(); primary(); } : null;
  setGauge(false);
}
function hideCard(){ cardEl.hidden = true; cardGo = null; }
const TITLE_HTML = `<h1><span class="a">Moitié</span><span class="cut"></span><span class="b">Moitié</span></h1>`;
const howHTML = `<div class="how">
  <div><b>Assemblés</b>Chacun pousse sa roue. Les deux en avant : tout droit. Un seul : le robot tourne.</div>
  <div><b>Sauter</b>Appuyez sur Action exactement en même temps, sinon le robot trébuche.</div>
  <div><b>Séparés</b>Clip pour se couper en deux. Chaque moitié roule seule et peut attraper ou appuyer.</div>
</div>`;
const controlsHTML = `<div class="ctrl">
  <div><h3 class="who-g">Joueur Gauche</h3><ul><li>Sa roue : <kbd>Z</kbd> avancer, <kbd>S</kbd> reculer</li><li>Séparé : <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> (ou WASD)</li><li>Action : <kbd>E</kbd> ou <kbd>Espace</kbd></li><li>Clip : <kbd>R</kbd></li></ul></div>
  <div><h3 class="who-d">Joueur Droite</h3><ul><li>Sa roue : <kbd>↑</kbd> avancer, <kbd>↓</kbd> reculer</li><li>Séparé : les flèches</li><li>Action : <kbd>Entrée</kbd></li><li>Clip : <kbd>Maj droite</kbd></li></ul></div>
</div>
<p class="hint">Manettes : la 1re joue la moitié gauche, la 2e la droite (stick, A = action, B = clip). Sur tablette ou téléphone, chacun prend un côté de l'écran. En ligne, chacun utilise les touches, la manette ou l'écran de son propre appareil.</p>`;

function menu(err){
  netClose(); NET.mode = 'local'; NET.cardKind = null; setPads();
  loadLevel(0); menuOrbit = true;
  showCard(`<div class="kicker">Jeu coopératif à deux</div>${TITLE_HTML}
    <p>Un savant distrait a coupé son robot en deux, de la tête aux roues. Un joueur pilote la <span class="who-g">moitié gauche</span>, l'autre la <span class="who-d">moitié droite</span>. Pour avancer, il faut se coordonner. Pour réussir les missions absurdes du labo, il faut parfois se séparer.</p>
    ${howHTML}
    ${err ? `<p class="err">${err}</p>` : ''}`,
    [{label:'Jouer sur cet appareil', on:() => intro(0)},
     {label:'Créer une partie en ligne', cls:'alt', on:createMenu},
     {label:'Rejoindre une partie', cls:'alt', on:joinMenu}],
    () => intro(0),
    `<div class="lvsel"><span>Choisir l'étage</span>${LEVELS.map((l, i) => `<button type="button" class="alt lv" data-lv="${i}" title="${l.title.replace(/"/g, '')}">${i+1}</button>`).join('')}</div><details><summary>Voir les commandes</summary>${controlsHTML}</details><p id="rotate" hidden>Astuce : tourne l'appareil à l'horizontale pour avoir plus de place.</p>`);
  if (innerHeight > innerWidth && !touchEl.hidden){ const r = $('#rotate'); if (r) r.hidden = false; }
  cardBox.querySelectorAll('[data-lv]').forEach(b => b.addEventListener('click', () => { ensureAudio(); intro(+b.dataset.lv); }));
}
function createMenu(){
  showCard(`<div class="kicker">Partie en ligne</div><h1>Quelle moitié pilotes-tu ?</h1><p>Ton ami pilotera l'autre moitié depuis son ordinateur, sa tablette ou son téléphone.</p>`,
    [{label:'La moitié gauche', cls:'alt g', on:() => hostGame('g')}, {label:'La moitié droite', cls:'alt d', on:() => hostGame('d')}, {label:'Retour', cls:'alt', on:() => menu()}], null);
}
function joinMenu(err){
  menuOrbit = true;
  showCard(`<div class="kicker">Partie en ligne</div><h1>Rejoindre</h1><p>Tape le code à 4 caractères affiché sur l'écran de ton ami.</p>
    <input id="code-in" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Code de la partie" placeholder="CODE">
    ${err ? `<p class="err">${err}</p>` : ''}`,
    [{label:'Rejoindre', on:tryJoin}, {label:'Retour', cls:'alt', on:() => menu()}], null);
  const inp = $('#code-in');
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter'){ e.preventDefault(); tryJoin(); } });
  setTimeout(() => { try { inp.focus(); } catch(e){} }, 50);
}
function tryJoin(){
  const c = ($('#code-in').value || '').trim().toLowerCase();
  if (!/^[a-z0-9]{4}$/.test(c)) return joinMenu('Le code fait 4 caractères (lettres ou chiffres).');
  joinGame(c);
}
function introHTML(i){ return `<div class="kicker">Étage ${i+1} sur ${LEVELS.length}</div><h1>${LEVELS[i].title}</h1><p>${LEVELS[i].intro}</p><p>${L.mission}</p>`; }
function winHTML(sec){ const m = Math.floor(sec/60), s = Math.floor(sec%60); return `<div class="kicker">Évasion réussie</div>${TITLE_HTML}<p>Les deux moitiés sont sorties du laboratoire en ${m} min ${String(s).padStart(2,'0')} s. Le savant cherche encore son robot. Et son chat.</p>`; }
function intro(i){
  menuOrbit = false; loadLevel(i); NET.cardKind = 'intro';
  const go = () => { hideCard(); NET.cardKind = null; playing = true; };
  showCard(introHTML(i), [{label:'C\'est parti', on:go}], go);
}
function finishLevel(){
  playing = false; setGauge(false); blip(523,.12,'triangle'); setTimeout(() => blip(784,.18,'triangle'), 120);
  if (levelIndex + 1 < LEVELS.length) intro(levelIndex + 1);
  else {
    NET.cardKind = 'win';
    const again = () => { elapsed = 0; intro(0); };
    const btns = [{label:'Rejouer', on:again}];
    if (NET.mode === 'local') btns.push({label:'Menu', cls:'alt', on:() => menu()});
    showCard(winHTML(elapsed), btns, again);
  }
}

/* ---------- Réseau : partie en ligne sur deux appareils ---------- */
let netImpl = null;
const randCode = () => Array.from({length:4}, () => 'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('');
const keysOrig = $('#keys').innerHTML;
function setPads(){
  const online = NET.mode !== 'local';
  document.querySelector('.pad.left').hidden = online && NET.role !== 'g';
  document.querySelector('.pad.right').hidden = online && NET.role !== 'd';
  const k = $('#keys');
  if (online){
    const who = NET.role === 'g' ? '<b class="who-g">la moitié gauche</b>' : '<b class="who-d">la moitié droite</b>';
    k.innerHTML = `<span class="glass" style="max-width:none">Tu pilotes ${who} · sa roue : <kbd>Z</kbd><kbd>S</kbd> ou <kbd>↑</kbd><kbd>↓</kbd> · séparé : ZQSD ou flèches · action : <kbd>E</kbd> ou <kbd>Entrée</kbd> · clip : <kbd>R</kbd> ou <kbd>Maj droite</kbd></span>`;
  } else k.innerHTML = keysOrig;
}
function netClose(){ try { netImpl && netImpl.close(); } catch(e){} netImpl = null; NET.pending = null; NET.remote = null; NET.shownCard = ''; }
function netLost(){ if (NET.mode !== 'local') showToast('La connexion avec ton ami est coupée.', 4000); }
async function netOpen(kind, code){
  netClose(); NET.pending = kind; NET.code = code; NET.lastRx = performance.now();
  if (window.claude && typeof window.claude.use === 'function'){
    const room = await window.claude.use('room');
    if (!room) throw new Error('Le mode en ligne ne marche pas dans cette vue. Utilise la version du jeu publiée sur GitHub (fichier index.html).');
    let r;
    try { r = await room.join('mm-' + code); }
    catch(e){ throw new Error('Impossible d\'ouvrir la partie en ligne ici. Utilise la version GitHub du jeu.'); }
    const off = r.onPeers(ch => { for (const p of ch.peers){ if (p.isMe) continue; const d = p.presence && p.presence.m; if (d) onNet(d); } });
    netImpl = { send: o => { r.presence({m:o}).catch(() => {}); }, close: () => { try { off(); } catch(e){} r.leave().catch(() => {}); } };
  } else {
    await loadPeer();
    netImpl = await peerOpen(kind, code);
  }
}
function loadPeer(){
  return new Promise((res, rej) => {
    if (window.Peer) return res();
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = () => res(); s.onerror = () => rej(new Error('Impossible de charger le module en ligne. Vérifie ta connexion internet.'));
    document.head.appendChild(s);
  });
}
function peerOpen(kind, code){
  return new Promise((res, rej) => {
    const id = 'moitiemoitie-' + code;
    const peer = kind === 'host' ? new window.Peer(id) : new window.Peer();
    let conn = null, lastSend = 0, done = false;
    const impl = {
      send(o){ const now = performance.now(); if (conn && conn.open && now - lastSend > 40){ lastSend = now; try { conn.send(o); } catch(e){} } },
      close(){ try { peer.destroy(); } catch(e){} }
    };
    const wire = c => { conn = c; c.on('data', d => onNet(d)); c.on('close', () => netLost()); };
    peer.on('error', e => {
      const ty = e && e.type;
      const msg = ty === 'unavailable-id' ? 'Ce code est déjà utilisé, recommence.' : ty === 'peer-unavailable' ? 'Aucune partie avec ce code. Vérifie les 4 caractères.' : 'Connexion impossible (' + (ty || 'erreur') + ').';
      if (!done){ done = true; try { peer.destroy(); } catch(_){} rej(new Error(msg)); } else netLost();
    });
    if (kind === 'host'){
      peer.on('open', () => { done = true; res(impl); });
      peer.on('connection', c => { if (conn){ c.close(); return; } wire(c); });
    } else {
      peer.on('open', () => { const c = peer.connect(id, {reliable:true}); wire(c); c.on('open', () => { done = true; res(impl); }); });
      setTimeout(() => { if (!done){ done = true; try { peer.destroy(); } catch(_){} rej(new Error('Pas de réponse. Vérifie le code et que ton ami attend bien sur l\'écran du code.')); } }, 12000);
    }
  });
}
async function hostGame(role){
  NET.role = role;
  const code = randCode();
  showCard(`<div class="kicker">Partie en ligne</div><h1>Connexion…</h1><p>Préparation de la partie.</p>`, [{label:'Annuler', cls:'alt', on:() => menu()}], null);
  try { await netOpen('host', code); }
  catch(e){ menu(e.message); return; }
  const mine = role === 'g' ? 'la moitié gauche' : 'la moitié droite', other = role === 'g' ? 'la moitié droite' : 'la moitié gauche';
  showCard(`<div class="kicker">Partie en ligne · tu pilotes ${mine}</div><h1>Code de la partie</h1><div class="code">${code.toUpperCase()}</div>
    <p>Ton ami ouvre le jeu sur son appareil, choisit <b>Rejoindre une partie</b> et tape ce code. Il pilotera ${other}.</p><p class="hint">En attente du 2e joueur…</p>`,
    [{label:'Annuler', cls:'alt', on:() => menu()}], null);
}
async function joinGame(code){
  showCard(`<div class="kicker">Partie en ligne</div><h1>Connexion…</h1><p>Recherche de la partie ${code.toUpperCase()}.</p>`, [{label:'Annuler', cls:'alt', on:() => menu()}], null);
  try { await netOpen('guest', code); }
  catch(e){ joinMenu(e.message); return; }
  showCard(`<div class="kicker">Partie en ligne</div><h1>Connecté</h1><p>En attente de ton ami…</p>`, [{label:'Annuler', cls:'alt', on:() => menu()}], null);
}
function onNet(d){
  if (!d || typeof d !== 'object') return;
  NET.lastRx = performance.now();
  if (Array.isArray(d.in) && (NET.pending === 'host' || NET.mode === 'host')){
    if (NET.pending === 'host'){ NET.pending = null; NET.mode = 'host'; setPads(); intro(0); showToast('Ton ami est connecté !', 2000); }
    remoteIn.mx = clamp(+d.in[0] || 0, -1, 1); remoteIn.mz = clamp(+d.in[1] || 0, -1, 1);
    remoteIn.ac = d.in[2] | 0; remoteIn.cc = d.in[3] | 0; remoteIn.go = d.in[4] | 0;
  }
  if (d.st && typeof d.st === 'object' && (NET.pending === 'guest' || NET.mode === 'guest')){
    if (NET.pending === 'guest'){
      NET.pending = null; NET.mode = 'guest'; menuOrbit = false; NET.role = d.st.hr === 'g' ? 'd' : 'g'; setPads(); hideCard();
      NET.seenToast = Array.isArray(d.st.ts) ? d.st.ts[0] : 0;
      NET.seenFx = Array.isArray(d.st.fx) && d.st.fx.length ? (d.st.fx[d.st.fx.length-1][0] | 0) : 0;
    }
    NET.remote = d.st;
  }
}
function hostState(){
  return {hr:NET.role, lv:levelIndex, sd:levelSeed,
    g:[r2(G.x), r2(G.z), r2(G.face), r2(G.walk), r2(G.wheel), G.grab > 0 ? 1 : 0],
    dd:[r2(D.x), r2(D.z), r2(D.face), r2(D.walk), r2(D.wheel), D.grab > 0 ? 1 : 0],
    r:[r2(robot.x), r2(robot.z), r2(robot.h), r2(robot.y), r2(robot.lean), robot.wobble > 0 ? 1 : 0],
    th:[r2(throttle.g), r2(throttle.d)],
    a:assembled ? 1 : 0, d:(door && door.open) ? 1 : 0, t:r2(t), v:L.getVis ? L.getVis() : 0,
    gt:GATES.map(g => g.open ? 1 : 0), ts:NET.toast, cd:NET.cardKind, pl:playing ? 1 : 0, el:Math.round(elapsed),
    it:ITEMS.map(i => [r2(i.x), r2(i.z), i.holder === G ? 1 : i.holder === D ? 2 : i.locked ? 3 : 0, i.active ? 1 : 0]),
    pr:[G.prompt.slice(0, 80), D.prompt.slice(0, 80)], fx:NETFX};
}
function guestGo(){ NET.go++; cardGo = null; cardBox.querySelectorAll('.actions button').forEach(b => { b.textContent = 'En attente…'; b.disabled = true; }); }
function applyHalf(h, a, k){
  if (!Array.isArray(a)) return;
  h.x = lerp(h.x, +a[0] || 0, k); h.z = lerp(h.z, +a[1] || 0, k); h.face = lerpAngle(h.face, +a[2] || 0, k);
  h.walk = +a[3] || 0; h.wheel = +a[4] || 0; if (a[5]) h.grab = 0.2;
}
function guestUpdate(dt){
  const inp = readInput(), m = inp.mine;
  if (m.actionEdge){ NET.ac++; if (cardGo) cardGo(); }
  if (m.clipEdge) NET.cc++;
  if (netImpl) netImpl.send({in:[r2(m.mx), r2(m.mz), NET.ac, NET.cc, NET.go]});
  const s = NET.remote; if (!s) return;
  const lv = clamp(s.lv | 0, 0, LEVELS.length-1), sd = s.sd | 0;
  if (loadedKey !== lv + ':' + sd) loadLevel(lv, sd);
  const ck = s.cd === 'intro' || s.cd === 'win' ? s.cd + ':' + lv + ':' + sd : '';
  if (ck !== NET.shownCard){
    NET.shownCard = ck;
    if (s.cd === 'intro') showCard(introHTML(lv), [{label:'C\'est parti', on:guestGo}], guestGo);
    else if (s.cd === 'win') showCard(winHTML(s.el | 0), [{label:'Rejouer', on:guestGo}], guestGo);
    else hideCard();
  }
  playing = !!s.pl;
  const k = Math.min(1, dt*15);
  assembled = !!s.a;
  const r = Array.isArray(s.r) ? s.r : [];
  robot.x = lerp(robot.x, +r[0] || 0, k); robot.z = lerp(robot.z, +r[1] || 0, k); robot.h = lerpAngle(robot.h, +r[2] || 0, k);
  robot.y = +r[3] || 0; robot.lean = +r[4] || 0; if (r[5]) robot.wobble = 0.1;
  applyHalf(G, s.g, k); applyHalf(D, s.dd, k);
  if (assembled) placeHalves();
  robot.wobble = Math.max(0, robot.wobble - dt);
  const th = Array.isArray(s.th) ? s.th : [0,0];
  t = +s.t || 0;
  if (door){ door.open = !!s.d; door.pad.glow(door.open); }
  if (L.setVis) L.setVis(s.v, dt);
  for (const Lz of W.lasers) updateLaser(Lz);
  for (const c of CRUSHERS) updateCrusher(c);
  if (Array.isArray(s.gt)) s.gt.forEach((o, i) => { if (GATES[i]) GATES[i].set(!!o); });
  if (Array.isArray(s.ts) && s.ts[0] !== NET.seenToast){
    NET.seenToast = s.ts[0];
    if (s.ts[1]){ toastEl.textContent = String(s.ts[1]).slice(0, 200); toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), clamp(+s.ts[2] || 2000, 600, 5000)); blip(500,.06,'triangle'); }
  }
  if (Array.isArray(s.it)) s.it.forEach((a, i) => {
    const it = ITEMS[i]; if (!it || !Array.isArray(a)) return;
    it.active = !!a[3]; const hc = a[2] | 0;
    const holder = hc === 1 ? G : hc === 2 ? D : null;
    if (it.holder && it.holder !== holder) it.holder.item = null;
    it.holder = holder; if (holder) holder.item = it;
    it.locked = hc === 3; it.mesh.userData.halo.visible = !holder && !it.locked;
    if (!holder){ it.x = +a[0] || 0; it.z = +a[1] || 0; if (it.locked) it.mesh.position.set(it.x, 0, it.z); }
  });
  for (const sk of SOCKETS) sk.ring.visible = !ITEMS.some(i => i.locked && i.kind === sk.kind && Math.hypot(i.x - sk.x, i.z - sk.z) < 0.3);
  if (Array.isArray(s.pr)){ G.prompt = String(s.pr[0] || '').slice(0, 80); D.prompt = String(s.pr[1] || '').slice(0, 80); }
  if (Array.isArray(s.fx)) for (const e of s.fx){ if (!Array.isArray(e) || (e[0] | 0) <= NET.seenFx) continue; NET.seenFx = e[0] | 0; const kinds = ['pick','clip','zap','jump','dust','win']; if (kinds.includes(e[1])) playFx(e[1], +e[2] || 0, +e[3] || 0, /^#[0-9a-f]{6}$/i.test(e[4]) ? e[4] : '#ffd447'); }
  setGauge(playing && assembled, clamp(+th[0] || 0, -1, 1), clamp(+th[1] || 0, -1, 1));
  setStatus(statusLine());
}

/* ---------- Boucle ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (L){
    if (NET.mode === 'guest') guestUpdate(dt); else update(dt);
    if (!playing) t += dt*0.5;
    if (NET.mode === 'host' && netImpl) netImpl.send({st:hostState()});
    else if (NET.pending === 'guest' && netImpl) netImpl.send({in:[0, 0, NET.ac, NET.cc, NET.go]});   // le 2e joueur se signale à l'hôte
    animate(dt);
  }
  if (composer) composer.render(dt); else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
menu();
requestAnimationFrame(frame);
setupEnv().then(setupBloom);
})();
</script>
